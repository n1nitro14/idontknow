    <div ng-if="act_notfound==0">
    <!-- ไฟล์ -->
    <div class="list card activitytlistcard">
      <div class="item item-input" style="height:1.875em;background-color:#0c9691;color:white;font-size:18px;">รายงาน Transcript กิจกรรม</div>

      <div class="row">
        <!-- <div class="col">Transcript กิจกรรม</div> -->
        <div class="col iosfont" style="text-align:center; font-size: 18px;">
          <a ng-click="getActDetail()">แสดงรายงานการเข้าร่วมกิจกรรม <br>
            <span class="redfont">** ใช้เวลาในการโหลดข้อมูล **</span>
          </a>
        </div>
      </div>
      <div class="row">
        <div class="col"></div>
      </div>
    </div>

    <!-- ตารางกำหนดการลงทะเบียนเรียน -->
    <div class="list card activitytlistcard" ng-show="TranscriptDetail">
      <div class="item item-input" style="height:1.875em;background-color: rgba(12, 150, 145, 0.2);color:#444444;">รายงาน Transcript กิจกรรม</div>
      <!--LIST-->
      <div ng-repeat="actList in actDetailNisit.Detail">
        <ion-item class="item item-icon-right" ng-class="{active: isGroupShown(actList)}" ng-click="toggleGroup(actList)">
          <i class="icon custom-icon" ng-class="isGroupShown(actList) ? 'ion-ios-arrow-down' : 'ion-ios-arrow-right'"></i>
          <span style="font-size:16px; !important;">{{actList.label_name}}</span>
          <!-- <span class="iosfont" style="font-size: 0.8750em !important;">{{actList.Label_COUNT_P}}
            {{actList.Label_SCORE_SUM}}</span> -->
          <br ng-show="actList.LabelCOUNT_PG"><span class="iosfont" style="font-size:16px; !important;">{{actList.LabelCOUNT_PG}}&nbsp;
              {{actList.LabelCOUNT_G}}&nbsp;{{actList.LabelSCORE_G}}</span>
        </ion-item>

        <!-- ng-bind-html การแสดง syntax html ที่ส่งค่า html ผ่านตัวแปรมา -->
        <div ng-bind-html="renderHtml(actList.html_content)" ng-show="isGroupShown(actList)"></div>

      </div>
    </div>
  </div>
