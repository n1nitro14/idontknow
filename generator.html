<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NisitKU</title>
  <link rel="icon" type="image/png" href="img/uning.png">
  <link rel="apple-touch-icon" href="img/uning.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/uning.png">
  <style>
    @font-face {
      font-family: 'kufont';
      src: url('css/kubd.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'kufont';
      src: url('css/kubd.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'kufont';
      src: url('css/kubd.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'ku2font';
      src: url('css/kumed.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'ku2font';
      src: url('css/kumed.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'ku3font';
      src: url('css/kuli.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #00675E;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand img {
      height: 34px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card-panel {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #00675E;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00675E;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #00675E;
      color: white;
    }

    .btn-primary:hover {
      background: #005049;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    /* PREVIEW CONTAINER */
    .preview-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 30px 20px;
    }

    .preview-card-outer {
      width: 340px;
      height: 538px;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      background: #fff;
    }

    .preview-card-bg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* EXACT CALIBRATED POSITIONING MATCHING OFFICIAL SPEC */
    .p-photo {
      position: absolute;
      top: 26.7%;
      left: 3.5%;
      width: 37.8%;
      height: 30.2%;
      overflow: hidden;
      background: #ddd;
    }

    .p-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .p-id {
      position: absolute;
      top: 21.9%;
      left: 47.2%;
      font-family: 'ku2font', sans-serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: #141414;
      white-space: nowrap;
    }

    .p-name-th {
      position: absolute;
      top: 28.5%;
      left: 47.2%;
      font-family: 'kufont', sans-serif;
      font-size: 1.42rem;
      line-height: 22px;
      color: #141414;
      white-space: pre-line;
    }

    .p-name-en {
      position: absolute;
      top: 38.9%;
      left: 47.2%;
      font-family: 'ku2font', sans-serif;
      font-size: 1.40rem;
      line-height: 22px;
      color: #141414;
      white-space: pre-line;
    }

    .p-service {
      position: absolute;
      top: 49.1%;
      left: 47.2%;
      font-family: 'kufont', sans-serif;
      font-size: 1.34rem;
      line-height: 21px;
      color: #141414;
      white-space: pre-line;
    }

    /* KULINET BARCODE BOX (Matching Official NisitKU) */
    .barcode-box {
      width: 330px;
      margin-top: 18px;
      background: white;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .barcode-header {
      background: #33cd5f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 5px 12px;
      letter-spacing: 0.3px;
    }

    .barcode-body {
      padding: 10px 12px 14px 12px;
      text-align: center;
      background: #ffffff;
    }

    .barcode-number {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .barcode-svg-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .barcode-svg-wrap canvas {
      max-width: 100%;
      height: 65px;
    }

    .status-alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 14px;
      display: none;
    }
    .status-alert.success {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }
    .status-alert.error {
      background: #fed7d7;
      color: #742a2a;
      display: block;
    }
  </style>
</head>

        <button class="btn-secondary" id="btnDownloadJson" style="font-size:0.95rem; padding:10px;">📄 4. ดาวน์โหลดไฟล์ข้อมูล (<span class="slug-label">natthapol</span>.json)</button>

    <!-- LIVE PREVIEW (MATCHING REFERENCE IMAGE) -->
    <div class="preview-wrapper">

      <!-- CARD PREVIEW -->

  </div>

  <!-- HIDDEN HI-RES CANVAS (2072 x 3276) FOR DIRECT JPG RENDERING -->
  <canvas id="hiResCanvas" width="2072" height="3276" style="display:none;"></canvas>
  <canvas id="hiResBarcodeCanvas" width="800" height="260" style="display:none;"></canvas>

  <script>
    let photoBase64 = null;
    let uploadedPhotoFile = null;
    let photoExt = "jpg";
    let photoImgElement = new Image();
    photoImgElement.crossOrigin = "anonymous";
    photoImgElement.src = "img/natthapol.jpg";

    const bgCardImg = new Image();
    bgCardImg.crossOrigin = "anonymous";
    bgCardImg.src = "img/f_bc.jpg";

    // Elements
    const inputSlug = document.getElementById('inputSlug');
    const inputId = document.getElementById('inputId');
    const inputNameTh = document.getElementById('inputNameTh');
    const inputSurnameTh = document.getElementById('inputSurnameTh');
    const inputNameEn = document.getElementById('inputNameEn');
    const inputSurnameEn = document.getElementById('inputSurnameEn');
    const inputFaculty1 = document.getElementById('inputFaculty1');
    const inputFaculty2 = document.getElementById('inputFaculty2');
    const inputBarcode = document.getElementById('inputBarcode');
    const inputPhoto = document.getElementById('inputPhoto');

    const prevPhoto = document.getElementById('prevPhoto');
    const prevId = document.getElementById('prevId');
    const prevNameTh = document.getElementById('prevNameTh');
    const prevNameEn = document.getElementById('prevNameEn');
    const prevService = document.getElementById('prevService');
    const prevBarcodeNum = document.getElementById('prevBarcodeNum');
    const barcodeCanvas = document.getElementById('barcodeCanvas');
    const hiResCanvas = document.getElementById('hiResCanvas');
    const hiResBarcodeCanvas = document.getElementById('hiResBarcodeCanvas');

    // Set default values to natthapol reference
    inputSlug.value = "natthapol";
    inputId.value = "6821861714";
    inputNameTh.value = "ณัฐพล";
    inputSurnameTh.value = "หมวกเมือง";
    inputNameEn.value = "Natthapol";
    inputSurnameEn.value = "Muakmuang";
    inputFaculty1.value = "Hospitality";
    inputFaculty2.value = "Industry";
    inputBarcode.value = "20068218617143";

    // Official KULINET Code 128 (Start B + Code C) Barcode Generator
    function getCode128BitString(text) {
      const cleanDigits = (text || '').replace(/\D/g, '');
      const PATTERNS = [
        "212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213",
        "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132",
        "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211",
        "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313",
        "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331",
        "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111",
        "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214",
        "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111",
        "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141",
        "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141",
        "114131", "311141", "411131", "211412", "211214", "211232", "2331112"
      ];

      // Exact NisitKU KULINET format: Start B (104) -> Code C (99) -> 2-digit pairs
      let values = [104, 99];
      for (let i = 0; i < cleanDigits.length; i += 2) {
        if (i + 1 < cleanDigits.length) {
          values.push(parseInt(cleanDigits.substring(i, i + 2), 10));
        } else {
          values.push(100); // Switch to Code B for odd trailing digit
          values.push(cleanDigits.charCodeAt(i) - 32);
        }
      }

      // Checksum mod 103
      let checksum = values[0];
      for (let i = 1; i < values.length; i++) {
        checksum += i * values[i];
      }
      values.push(checksum % 103);
      values.push(106); // Stop pattern

      let bitString = "";
      for (let v of values) {
        let pat = PATTERNS[v];
        let bar = true;
        for (let c of pat) {
          bitString += (bar ? "1" : "0").repeat(parseInt(c, 10));
          bar = !bar;
        }
      }
      return bitString;
    }

    // Code128 generator for preview Canvas
    function drawCode128(text, canvas) {
      const bitString = getCode128BitString(text);
      const mw = 2.4;
      const h = 42;
      const totalWidth = bitString.length * mw;
      canvas.width = Math.ceil(totalWidth + 30);
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000000';
      let x = (canvas.width - totalWidth) / 2;
      for (let i = 0; i < bitString.length; i++) {
        if (bitString[i] === '1') ctx.fillRect(Math.round(x), 0, Math.ceil(mw), h);
        x += mw;
      }
    }

    // High-Resolution Standalone Barcode Generator (PNG - Pixel-perfect match to official NisitKU)
    function renderHiResBarcode() {
      const text = inputBarcode.value.trim() || "20068218617143";
      const bitString = getCode128BitString(text);
      const canvas = hiResBarcodeCanvas;
      canvas.width = 754;
      canvas.height = 230;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Centered Number
      ctx.fillStyle = '#111111';
      ctx.font = '700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(text, canvas.width / 2, 22);

      // 2. Draw Code 128 Bars (Takes 91% of width matching official app)
      const mw = 5.58;
      const h = 112;
      const totalBarsWidth = bitString.length * mw;
      let startX = (canvas.width - totalBarsWidth) / 2;
      const barY = 66;

      ctx.fillStyle = '#000000';
      let x = startX;
      for (let i = 0; i < bitString.length; i++) {
        if (bitString[i] === '1') {
          ctx.fillRect(Math.round(x), barY, Math.ceil(mw), h);
        }
        x += mw;
      }
    }

    // High-Resolution 2072 x 3276 Card Renderer
    async function renderHiResCard() {
      await document.fonts.ready;
      
      const ctx = hiResCanvas.getContext('2d');
      ctx.clearRect(0, 0, 2072, 3276);

      // 1. Background
      ctx.drawImage(bgCardImg, 0, 0, 2072, 3276);

      // 2. Photo (Smart Aspect-Ratio Cover Crop to prevent face distortion)
      if (photoImgElement && photoImgElement.complete) {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        const targetW = 783;
        const targetH = 990;
        const targetRatio = targetW / targetH;
        const nw = photoImgElement.naturalWidth || targetW;
        const nh = photoImgElement.naturalHeight || targetH;
        const imgRatio = nw / nh;
        let sx = 0, sy = 0, sw = nw, sh = nh;
        if (imgRatio > targetRatio) {
          sw = nh * targetRatio;
          sx = (nw - sw) / 2;
        } else {
          sh = nw / targetRatio;
          sy = (nh - sh) / 2;
        }
        ctx.drawImage(photoImgElement, sx, sy, sw, sh, 72, 875, targetW, targetH);
      }

      // 3. Text Layers (Calibrated pixel-perfect to official spec)
      ctx.fillStyle = '#111111';
      ctx.textBaseline = 'top';
      const textX = 978;

      // Group 1: ID
      ctx.font = '600 160px "ku2font", sans-serif';
      ctx.fillText('ID ' + inputId.value.trim(), textX, 722);

      // Group 2: Thai Name
      ctx.font = '700 158px "kufont", sans-serif';
      ctx.fillText(inputNameTh.value.trim(), textX, 940);
      ctx.fillText(inputSurnameTh.value.trim(), textX, 1070);

      // Group 3: English Name
      ctx.font = '600 158px "ku2font", sans-serif';
      ctx.fillText(inputNameEn.value.trim(), textX, 1268);
      ctx.fillText(inputSurnameEn.value.trim(), textX, 1400);

      // Group 4: Faculty / Service
      ctx.font = '700 152px "kufont", sans-serif';
      ctx.fillText(inputFaculty1.value.trim(), textX, 1602);
      ctx.fillText(inputFaculty2.value.trim(), textX, 1725);
    }

    function updatePreview() {

    // Photo input
    inputPhoto.addEventListener('change', function(e) {

          photoExt = file.name.substring(dotIdx + 1).toLowerCase();
          if (photoExt === 'jpeg') photoExt = 'jpg';
        } else {
          photoExt = 'jpg';
        }
        const reader = new FileReader();
        reader.onload = function(evt) {
          photoBase64 = evt.target.result;
          prevPhoto.src = photoBase64;
          photoImgElement.src = photoBase64;
          updatePreview();
        };

      }

    // Inputs live update

      el.addEventListener('input', updatePreview);
    });

    updatePreview();

    // Helper: convert Data URI to Blob safely without network calls
    function dataURItoBlob(dataURI) {
      try {
        const parts = dataURI.split(',');
        const byteString = atob(parts[1]);
        const mimeString = parts[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], { type: mimeString });
      } catch (e) {
        return null;
      }
    }

    // Helper: trigger browser file download with delayed revocation to avoid cancellation
    function downloadBlob(blob, filename) {
      if (!blob) {
        alert("ไม่สามารถสร้างไฟล์สำหรับดาวน์โหลดได้ กรุณาลองใหม่อีกครั้ง");
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        if (a.parentNode) document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2500);
    }

    // 1. Download Card JPG (2072 x 3276, 98% quality)
    document.getElementById('btnDownloadCard').addEventListener('click', async function() {
      const alertBox = document.getElementById('statusAlert');

      alertBox.innerText = '⏳ กำลังเรนเดอร์ภาพความละเอียดสูง 2072 x 3276...';

      try {
        await renderHiResCard();

        hiResCanvas.toBlob(function(blob) {
          if (!blob) {
            alertBox.className = 'status-alert error';
            alertBox.innerText = '❌ เกิดข้อผิดพลาด ไม่สามารถส่งออกภาพหน้าบัตรได้';
            return;
          }
          const slug = (inputSlug.value.trim() || 'card').toLowerCase();
          downloadBlob(blob, slug + '.jpg');
          alertBox.className = 'status-alert success';
          alertBox.innerText = '✅ ดาวน์โหลด ' + slug + '.jpg สำเร็จ!';
        }, 'image/jpeg', 0.98);
      } catch (err) {
        alertBox.className = 'status-alert error';
        alertBox.innerText = '❌ เกิดข้อผิดพลาด: ' + err.message;
      }
    });

    document.getElementById('btnDownloadBarcode').addEventListener('click', function() {
      renderHiResBarcode();

          return;

        downloadBlob(blob, slug + '_barcode.png');
      }, 'image/png');
    });

    // 3. Download Profile Photo (<slug>_img.<ext>)
    document.getElementById('btnDownloadProfile').addEventListener('click', async function() {
      const slug = (inputSlug.value.trim() || 'card').toLowerCase();
      const filename = `${slug}_img.${photoExt}`;

      if (uploadedPhotoFile) {
        downloadBlob(uploadedPhotoFile, filename);
        return;
      }

      if (photoBase64 && photoBase64.startsWith('data:')) {
        const b = dataURItoBlob(photoBase64);
        if (b) {
          downloadBlob(b, filename);
          return;
        }
      }

      // Fallback using in-memory canvas
      try {
        const c = document.createElement('canvas');
        c.width = photoImgElement.naturalWidth || 400;
        c.height = photoImgElement.naturalHeight || 500;
        const ctx = c.getContext('2d');
        ctx.drawImage(photoImgElement, 0, 0);
        c.toBlob(function(b) {
          if (b) downloadBlob(b, filename);
          else alert("กรุณาเลือกรูปถ่ายนิสิตก่อนดาวน์โหลด");
        }, 'image/jpeg', 0.95);
      } catch (e) {
        try {
          const resp = await fetch(photoImgElement.src);
          const blob = await resp.blob();
          downloadBlob(blob, filename);
        } catch (err) {
          alert("กรุณาอัพโหลดรูปถ่ายนิสิตก่อนดาวน์โหลด");
        }
      }
    });

    // 4. Download JSON Config
    document.getElementById('btnDownloadJson').addEventListener('click', function() {
      const slug = (inputSlug.value.trim() || 'card').toLowerCase();

      downloadBlob(blob, slug + '.json');
    });

    // Student ID Generator (Preserve first 2 digits, randomize remaining 8 digits)
    document.getElementById('btnGenStudentId').addEventListener('click', function() {
      const cur = inputId.value.trim().replace(/\D/g, '');
      const prefix = cur.length >= 2 ? cur.substring(0, 2) : '68';
      let remaining = '';
      for (let i = 0; i < 8; i++) {
        remaining += Math.floor(Math.random() * 10).toString();
      }
      inputId.value = prefix + remaining;
      updatePreview();
    });

    // Barcode Generator from Student ID (KULINET: 200 + ID + CheckDigit)
    function generateKulinetBarcode(id) {
      const cleanId = (id || '').replace(/\D/g, '');
      if (!cleanId) return '20068218617143';
      const prefix = '200' + cleanId;
      let sum = 0;
      for (let i = 0; i < prefix.length; i++) {
        const w = (i % 2 === 0) ? 1 : 3;
        sum += parseInt(prefix[i], 10) * w;
      }
      const checkDigit = (10 - (sum % 10)) % 10;
      return prefix + checkDigit;
    }

    document.getElementById('btnGenBarcode').addEventListener('click', function() {
      const idVal = inputId.value.trim();
      if (!idVal) {
        alert('กรุณากรอกรหัสนิสิตก่อนสร้างบาร์โค้ด');

      inputBarcode.value = generateKulinetBarcode(idVal);

    selectFacultyTemplate.addEventListener('change', function() {
