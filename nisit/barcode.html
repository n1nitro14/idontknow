<style>
#barcode{
    padding:5px;
    background-color: #FFFFFF;
    opacity: 1 !important;
    /*width: 120px;*/
    border-radius: 5px;
}
#barcode img{
  height: 100% !important;
}

.ion-nifty-modal {
  width: 50%;
  min-height: 0 !important;

  top: 5%;
  left: 25%;
  right: 25%;
  bottom: 5%;

  background-color: transparent;
  border-radius: 10px;
}

.ion-nifty-modal .ion-modal-content-custom {
  width: 100%;
  height: 100%;
  color: #FFF;
  background-color: transparent;
  border-radius: 10px;
}

/* Fix modal backdrop for smaller devices */
@media (max-width: 679px) {
  .active .modal-backdrop-bg {
    opacity: .5;
  }
  .modal-backdrop-bg {
    -webkit-transition: opacity 300ms ease-in-out;
    transition: opacity 300ms ease-in-out;
    background-color: #000;
    opacity: 0;
  }
}

</style>
<ion-modal-view class="ion-nifty-modal">
  <div class="ion-modal-content-custom">
    <ion-content class="padding">
      <center style="height:100%">
          <div id="barcode" style="height:100%">
            <img ng-src="{{barcode}}">
          </div>
      </center>
    </ion-content>
    <div style="text-align: right;">
      <button class="button button-clear icon ion-ios-close-outline" ng-click="closeBarcodeModal()"></button>
    </div>
  </div>
</ion-modal-view>
