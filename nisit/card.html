<ion-view title='Student Card'>
    <ion-nav-bar class="bar-subheader bar-light">
      <ion-nav-back-button class="button icon ion-ios-arrow-back stylesec2">
        <!-- <i class="ion-chevron-left"></i> -->
      </ion-nav-back-button>
      <ion-nav-buttons side="right">
        <button class="button button-icon button-clear"
        ng-class="showBarcode? 'ion-ios-barcode' : 'ion-ios-barcode-outline'" ng-click="changeBarcode();"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-content class="has-subheader bgcontent" ng-init="getProfile();toggle=false;">

      <!-- <pre ng-bind="profileNisit | json"></pre> -->
      <!-- <img src="./img/bg6.jpg" style="margin-bottom:0em;" width="100%"> -->

      <div style="text-align: center; padding-top:22px;" ng-if="profileNisit.student_card!=''">
        <div class="flip" ng-class="{'is-flipped':toggle}" ng-click="toggle = !toggle">
          <div class="front">
            <img ng-src="{{profileNisit.student_card}}" width="80%">
          </div>
          <div class="back">
            <img ng-src="{{profileNisit.student_card_b}}" width="80%">
          </div>
        </div>
      </div>

      <div ng-if="showBarcode==true">
        <center>
        <div class="list card" ng-if="profileNisit.img_barcode!=''" style="width:80%;">
            <div class="item item-input item-balanced" style="height:1.25em;">KULINET</div>
            <div class="item" style="text-align: center; padding: 0;">
            <img ng-src="{{profileNisit.img_barcode}}" width="100%" >
            </div>
        </div>
      </center>
     </div>

    </ion-content>
  </ion-view>
