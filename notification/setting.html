<ion-view title='Setting'>

  <ion-nav-bar class="bar-subheader bar-light">
    <ion-nav-back-button class="button icon ion-ios-arrow-back stylesec2">
      <!-- <i class="ion-chevron-left"></i> -->
    </ion-nav-back-button>
  </ion-nav-bar>
  <ion-content class="has-header has-subheader" ng-init="initSettings()">
    <div class="item item-divider"><h4 style="padding-top:30px;color:#888;">OPTIONS</h4></div>
    <div class="row moretable" ng-repeat="item in settingsList">
      <div class="col col-10" style="text-align:center;"><img style="width: 20px;" ng-src="{{item.icon}}"></div>
      <div class="col col-90" style="border-bottom: 1px solid #e9e5e5;padding:5px;">
        <ion-toggle style="border: 0px;padding:0px;"
          ng-model="item.checked"
          ng-checked="item.checked"
          ng-change="changeSettings(item)">
            {{ item.text }}
        </ion-toggle>
      </div>
    </div>

   </ion-content>

</ion-view>
